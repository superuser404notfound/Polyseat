# What a runner can check about Polyseat, which is less than it looks like and
# more than nothing.
#
# It cannot check the thing the project is: a runner has no GPU, no Incus, no
# udev worth the name and no second machine to stream to. host/test-install.sh
# covers the installer against a real VM and is run by hand.
#
# What it does cover is the class of breakage that never shows up on the machine
# this is written on, because that machine builds before it commits: a push that
# does not compile, a test that only passed against one person's filesystem, a
# shell script with a mistake in a branch nobody took yet. Somebody cloning main
# meets exactly those.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so there is one place that says which Go this is.
          go-version-file: go.mod
          cache: true

      # Without this the library package is green and tests nothing.
      #
      # Its tests need a filesystem that can share blocks, and they skip loudly
      # rather than pass quietly when there is none. A runner's disk is ext4,
      # which cannot, so every one of them would skip and the package that
      # exists to clone game directories would be checked by nobody. Half a
      # gigabyte of btrfs in a file fixes that.
      #
      # The packages are here for the same reason: without them the seat package
      # skips its icon tests (librsvg), its box art tests (Pillow) and every one
      # of its gamepad pointer tests (evdev, which the helper imports at the
      # top). The first run of this workflow skipped seventeen tests, and that
      # is how these three were found rather than guessed at.
      #
      # The bridge is a real one by the name the network tests look for. They
      # ask sysfs whether an interface is a bridge, which is a question only a
      # real interface can answer, and skip when there is none. It needs no
      # address and is never brought up.
      - name: A filesystem that can share blocks, and the helpers the tests use
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs librsvg2-bin python3-pil python3-evdev
          truncate -s 512M /tmp/reflink.img
          mkfs.btrfs -q /tmp/reflink.img
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop /tmp/reflink.img /mnt/reflink
          sudo chmod 0777 /mnt/reflink
          echo "POLYSEAT_TEST_DIR=/mnt/reflink" >> "$GITHUB_ENV"
          sudo ip link add incusbr0 type bridge

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - run: go vet ./...

      - run: go build ./...

      # Not run as root, even though one test asks for it and skips. Running the
      # whole suite as root would hide the opposite mistake, which this project
      # has already made once: a tree created 0700 as root looks perfectly
      # readable to root and is unusable to the player it was for.
      #
      # `set -o pipefail` is not decoration. The default shell here is `bash -e`
      # without it, so a pipe reports the status of `tee`, and a run whose tests
      # failed would go green.
      - name: go test
        run: |
          set -o pipefail
          go test ./... -v 2>&1 | tee /tmp/test.log

      # Printed rather than gated, from the log the run already produced rather
      # than from a second run of the whole suite. A skip is not a failure, but
      # a skip nobody sees is a test that quietly stopped existing.
      - name: What skipped
        if: always()
        run: |
          grep -E "^ *--- SKIP" -A1 /tmp/test.log || echo "nothing skipped"

  # The interface is 60 KB of JavaScript that nothing else here reads. A typo in
  # it does not fail a build, does not fail a test and does not fail vet: it
  # fails in somebody's browser, as a blank page with the reason in a console
  # nobody has open. --check parses without running, which is all that is wanted
  # and all that is safe to do to a file on a runner.
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse the interface
        run: |
          for f in internal/web/*.js; do
            node --check "$f"
            echo "ok $f"
          done

  shell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # bash -n first, because a parse error makes everything shellcheck says
      # about the same file beside the point. Every script rather than only the
      # host ones, which is what it said and not what it did.
      #
      # bash and not sh even for the files that declare #!/bin/sh, because this
      # step only claims to find parse errors and shellcheck is what says whether
      # a script is really POSIX. Running the runner's dash here instead would be
      # a stricter check nobody has measured against these files.
      - name: Parse every script
        run: |
          for f in host/*.sh packaging/scripts/*.sh internal/seat/assets/*.sh; do
            bash -n "$f"
          done

      # At warning and above. The scripts are clean at that level today, which
      # was measured before this was written rather than hoped for, and the
      # notes below it are style opinions this project does not share: single
      # quotes around a command meant to be expanded on the other side of an
      # `incus exec` are deliberate.
      - name: shellcheck
        run: |
          shellcheck --severity=warning host/*.sh
          shellcheck --severity=warning packaging/build-packages.sh
          # sh and not bash, and shellcheck has to be told: these two run under
          # whatever dpkg and rpm hand them, which is not bash on every machine.
          shellcheck --severity=warning --shell=sh packaging/scripts/*.sh
          # The scripts that run inside every seat, which were checked by nothing
          # until now: a green run here said something about the host half of the
          # project and nothing at all about the half that is provisioned into a
          # container. They carry their own #!/bin/sh, so unlike the two above
          # they do not have to be told which shell they are.
          shellcheck --severity=warning internal/seat/assets/*.sh

      # The one part of the distribution table that can be checked without the
      # distributions. It replaces every package manager with a script that
      # records how it was called, so it needs no root, no network and nothing
      # installed, and it covers the two rows nobody here runs: that distro.sh
      # reaches for apt-get and not pacman on Debian, with the arguments that
      # were meant, and that dnf is told to keep dependencies rather than taking
      # somebody's container manager with Polyseat.
      - name: The package manager table
        run: ./host/test-distro.sh

  # Two files nothing else in this repository reads, in front of the one part of
  # Polyseat a person meets before the daemon has said anything: the entry in
  # their application menu. A key misspelt in the .desktop file or an unclosed
  # tag in the icon does not fail a build, a test or vet. It fails as an entry
  # that is not in the menu, or is in it without a picture, on a machine nobody
  # here is sitting at, and the file has to be reinstalled to try again.
  desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: The tools that read them
        run: sudo apt-get install -y -qq desktop-file-utils librsvg2-bin

      # --warn-kde is not passed. It reports keys this entry has no reason to
      # carry, and a check that has to be read past is one nobody reads.
      - name: Validate the desktop entry
        run: desktop-file-validate host/polyseat.desktop

      # Rendered rather than parsed, and at the size that decided the drawing.
      # A renderer is what a menu uses, so a file that only an XML parser accepts
      # is not proof of anything; this is the same librsvg the seat icon tests
      # already need, so it costs the job nothing extra.
      - name: Render the icon at panel size
        run: |
          rsvg-convert -w 22 -h 22 host/polyseat.svg -o /tmp/polyseat-22.png
          rsvg-convert -w 128 -h 128 host/polyseat.svg -o /tmp/polyseat-128.png
          file /tmp/polyseat-22.png /tmp/polyseat-128.png
