# Builds the Arch package and attaches it to the release it belongs to.
#
# The AUR distributes recipes, not packages: installing from it means building
# it yourself. What somebody actually wants is a file they can install, and that
# is what this makes, so the unavailable AUR account blocks less than it looks
# like.
#
# The trigger is the commit that carries the PKGBUILD to a new version, and not
# the tag or the release, because that is the first moment everything agrees.
# The order in packaging/README.md is tag, publish, then bump the PKGBUILD, and
# it has to be that way round: the checksum is of the tarball that only exists
# once the tag does. On a tag push the PKGBUILD in the tree still names the
# version before it.
name: Package

on:
  push:
    branches: [main]
    paths:
      - packaging/aur/PKGBUILD
      - packaging/aur/polyseat.install
      - .github/workflows/package.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and replace the package on a release that already has one
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # An Arch container rather than an Arch VM, because makepkg needs pacman and
    # nothing here needs a kernel. host/test-package.sh covers what a container
    # cannot: installing the result on a real machine and starting it.
    container:
      image: archlinux:base-devel

    steps:
      # base-devel carries makepkg and the compilers and none of these. git is
      # for actions/checkout, which prefers it, and github-cli is what uploads.
      # The first four are what base-devel lacks: git for actions/checkout, which
      # prefers it, and github-cli to upload with. The rest are the PKGBUILD's
      # checkdepends, installed by hand because --nodeps below means makepkg
      # will not do it, and check() runs the real Python helpers.
      - name: What base-devel does not carry
        run: |
          pacman -Syu --noconfirm --needed \
            go git github-cli namcap \
            python-pillow librsvg python-evdev

      - uses: actions/checkout@v4

      # makepkg refuses to run as root and is right to. It runs a PKGBUILD,
      # which is a shell script from the internet as far as it knows.
      - name: A user to build as
        run: |
          useradd -m builder
          chown -R builder:builder .

      # --nodeps skips the check for incus, bpftrace and python, which are what
      # the daemon talks to at runtime and are not needed to compile it. Pulling
      # Incus into a build container to satisfy a check would cost minutes per
      # run and prove nothing that host/test-package.sh does not already prove
      # against a real machine.
      #
      # The checksum in the PKGBUILD is verified here as a side effect, and that
      # is worth having: a "Carry the package to X" commit with the wrong sum
      # fails at this step rather than shipping a package built from something
      # other than the tag it claims.
      - name: Build
        working-directory: packaging/aur
        run: sudo -u builder makepkg --noconfirm --nodeps

      # Printed, not enforced. packaging/README.md lists the six warnings that
      # are expected and says why each one is the tool being wrong. A step that
      # failed on them would train everyone to ignore it; a step that prints
      # them means anything new gets seen.
      - name: What namcap makes of it
        working-directory: packaging/aur
        run: |
          namcap PKGBUILD || true
          namcap ./*.pkg.tar.zst || true

      - name: Attach it to the release
        working-directory: packaging/aur
        # Named, because the default in a container is sh and the tests below
        # are bash. It worked only because Arch points /bin/sh at bash, which is
        # not a thing to rely on in a file that runs somewhere else one day.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Named rather than left to be worked out. Inside a container gh
          # derives the repository from the git remote, and the checkout here
          # belongs to another user by the time this step runs, so git declines
          # to read it and gh concludes there is no such release.
          GH_REPO: ${{ github.repository }}
        run: |
          # From the PKGBUILD rather than from the tag, so that this can only
          # ever upload to the release the package says it is for.
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          tag="v$pkgver"

          # Named rather than globbed. makepkg in this container has debug in
          # its default OPTIONS and therefore builds polyseat-debug-* beside the
          # real one, and a release page offering two files where one of them is
          # not installable is worse than one offering neither. The debug
          # package is not published: nothing links it, and split DWARF for a Go
          # binary is not what a bug report here is short of.
          pkg=$(echo polyseat-"$pkgver"-*-x86_64.pkg.tar.zst)
          stable=polyseat-x86_64.pkg.tar.zst

          if [[ ! -f $pkg ]]; then
            echo "::error::no package for $pkgver was built"
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::no release $tag to attach this to. Publish it first;"
            echo "::error::packaging/README.md has the order."
            exit 1
          fi

          # A published release does not change under people.
          #
          # This fires on any push that touches the PKGBUILD or this file, and
          # the PKGBUILD names the version before the bump for exactly one
          # commit, so a release commit rebuilds the *previous* version. Without
          # this it replaced that version's package with a fresh build of the
          # same source, which is wrong twice over: --clobber deletes before it
          # uploads, so the download URL 404s for a moment, and the bytes
          # anybody already had stop matching the bytes anybody gets next. It
          # happened to v0.3.2, and then to v0.3.3 by the first version of this
          # very guard, which read $pkg one line before it was assigned and so
          # compared every asset against the empty string.
          #
          # Rebuilding is still possible and has to be asked for by hand.
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qxF "$stable"; then
            if [[ "${{ inputs.rebuild }}" != "true" ]]; then
              echo "::notice::$tag already carries $stable, so it is left alone."
              echo "::notice::Run this workflow by hand with rebuild if that is really wanted."
              exit 0
            fi

            echo "::warning::replacing the package on $tag, which was asked for"
          fi

          # One file, under a name with no version in it.
          #
          # GitHub serves releases/latest/download/<name>, which is a permanent
          # link only while <name> is permanent, and makepkg's name carries the
          # version. pacman reads the package's name and version from inside the
          # file, so the name is free to say nothing and the documented command
          # never has to be edited.
          #
          # makepkg's own name is not published beside it. Two files on a
          # release page where either would do is a question asked of everybody
          # who arrives, and the release is already the thing that says which
          # version this is.
          cp -- "$pkg" "$stable"
          gh release upload "$tag" "$stable" --clobber

          echo "attached to $tag:"
          ls -la "$stable"
