name: It ran, or did not, on this machine
description: A report from a machine that is not the author's. Useful whether it worked or not, and most useful of all from an AMD card or a Debian or Fedora host
labels: [hardware]

body:
  - type: markdown
    attributes:
      value: |
        One Arch host with an RTX 4080 has seen every line of this project. Every
        machine that is not that one tells this project something it cannot find
        out for itself.

        **Three paths especially**, none of which has ever been run:

        - **An AMD card.** That whole path was written and reasoned about
          without a card to run it on.
        - **A Debian host** and **a Fedora host**, both new in 0.9.0. The host
          scripts are tested against stubbed package managers, which proves the
          right commands go out and not that they work.

        They are independent, so a machine that is two of them at once is doubly
        worth hearing about. In every case the first person to try it is doing
        something nobody has done, and the report is useful in either
        direction.

  - type: dropdown
    id: host
    attributes:
      label: What the host runs
      description: The distribution of the machine itself, not of the seats. Seats are Arch containers on every host.
      options:
        - Arch, or something based on it
        - Debian, Ubuntu, or something based on those
        - Fedora, or something based on it
        - Something else
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: How did it go
      options:
        - It works
        - It works, with something to say about it
        - It half works
        - It does not work
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: sudo polyseatd -report
      description: |
        The card, the driver, the distribution, the filesystem and the seats, in
        one go.

        **Read it before pasting.** It carries this machine's host name, its
        seat names and their private addresses, and no password or key.
      render: text
    validations:
      required: true

  - type: textarea
    id: encoder
    attributes:
      label: What the seat's card says the encoder is
      description: |
        The single most useful line for this question. `nvenc` or `vaapi` means
        the hardware path came up; anything else means a seat that starts,
        streams and looks perfectly healthy while encoding on the CPU.
      placeholder: "vaapi (H.264, HEVC, AV1)"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: |
        What you had to do that the documentation did not mention, what looked
        wrong, what the stream felt like. Rough notes are fine and are worth
        more than nothing.
