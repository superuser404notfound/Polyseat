<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyseat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Polyseat</h1>
  <div class="host">
    <span id="hostname"></span>
    <span id="observer" class="pill" title="The uhid observer records which container created which gamepad."></span>
    <span id="link" class="pill offline">offline</span>
    <button id="account" class="quiet" hidden>Account</button>
  </div>
</header>

<!-- Shown until there is a session. Everything the API serves is behind it. -->
<section id="login" class="login" hidden>
  <form id="login-form">
    <h2>Sign in</h2>
    <p class="hint">
      The first password is generated when the daemon starts for the first time
      and written to its log:
      <code>journalctl -u polyseatd | grep password</code>
    </p>

    <label>
      User name
      <input name="username" autocomplete="username" autocapitalize="none" required>
    </label>

    <label>
      Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>

    <p class="error" id="login-error"></p>

    <button class="primary" id="login-submit">Sign in</button>
  </form>
</section>

<main id="app" hidden>
  <div id="warnings"></div>
  <div id="seats" class="seats"></div>

  <button id="add" class="add">Add a seat</button>
</main>

<dialog id="editor">
  <form method="dialog" id="editor-form">
    <h2 id="editor-title">New seat</h2>

    <label>
      Name
      <input name="name" required pattern="[a-z][a-z0-9-]{1,30}[a-z0-9]" autocomplete="off">
      <small>Also the container name and the tag in the device names. It cannot be changed later.</small>
    </label>

    <label>
      Label
      <input name="label" autocomplete="off">
      <small>What it is called in this interface. Change this freely.</small>
    </label>

    <label>
      Resolution
      <input name="resolution" value="1920x1080@60Hz" required>
      <small>What the session comes up with. Moonlight renegotiates per client.</small>
    </label>

    <label>
      Address
      <input name="address" placeholder="empty means DHCP" autocomplete="off">
      <small>A fixed address in the form 10.20.30.71/24 keeps the seat's web interface reachable at the same place.</small>
    </label>

    <label>
      Gateway
      <input name="gateway" placeholder="10.20.30.1" autocomplete="off">
    </label>

    <label class="check">
      <input type="checkbox" name="autostart" checked>
      Start this seat when the daemon starts
    </label>

    <p class="error" id="editor-error"></p>

    <menu>
      <button value="cancel" type="button" id="editor-cancel">Cancel</button>
      <button value="save" id="editor-save" class="primary">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="password">
  <form method="dialog" id="password-form">
    <h2>Account</h2>

    <label>
      User name
      <input name="username" autocomplete="username" autocapitalize="none" required>
    </label>

    <label>
      Current password
      <input name="current" type="password" autocomplete="current-password" required>
      <small>Asked for again so that a borrowed browser cannot be made permanent.</small>
    </label>

    <label>
      New password
      <input name="new" type="password" autocomplete="new-password" minlength="8" required>
      <small>At least 8 characters. This guards a daemon that runs as root and answers on the network.</small>
    </label>

    <p class="error" id="password-error"></p>

    <menu>
      <button value="logout" type="button" id="logout" class="danger">Sign out</button>
      <span class="spacer"></span>
      <button value="cancel" type="button" id="password-cancel">Cancel</button>
      <button value="save" class="primary">Change</button>
    </menu>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
