# Polyseat - the application launcher in a seat session
#
# Generated by polyseatd. Edits are overwritten the next time the seat is
# provisioned.
#
# Colours match the bar. Without this fuzzel comes up light on a dark desktop,
# which on a stream that is already being scaled and re-encoded is a bright
# rectangle appearing over a dark one.

[main]
font=sans-serif:size=13
terminal=foot
layer=overlay
lines=14
width=45
horizontal-pad=20
vertical-pad=14
inner-pad=6

[colors]
background=1b2430f0
text=d8dee9ff
match=7fb2d8ff
selection=285577ff
selection-text=ffffffff
selection-match=9fd0f0ff
border=4c7899ff

[border]
width=2
radius=8
