# Polyseat - the application launcher in a seat session
#
# Generated by polyseatd. Edits are overwritten the next time the seat is
# provisioned.
#
# Colours match the bar. Without this fuzzel comes up light on a dark desktop,
# which on a stream that is already being scaled and re-encoded is a bright
# rectangle appearing over a dark one.

[main]
font=sans-serif:size=13
terminal=foot
layer=overlay
lines=18
width=45
horizontal-pad=20
vertical-pad=14
inner-pad=6

# Stay open when the keyboard focus goes elsewhere.
#
# Without this the launcher is only visible while the pointer rests on the bar
# button that opened it and vanishes the moment it moves, which makes it
# impossible to actually pick anything. fuzzel exits on losing keyboard focus by
# default, and opening it by clicking a layer-shell bar is exactly the case
# where it never properly gets that focus in the first place.
#
# It matters more here than on an ordinary desktop: a seat is often driven by a
# gamepad acting as a pointer, so clicking is the normal way to open this and
# the keyboard may not be involved at all.
exit-on-keyboard-focus-loss=no
keyboard-focus=on-demand

# No launch prefix, and that is the whole point of this comment.
#
# This used to be launch-prefix=/usr/bin/mangohud, so that a game started from
# the launcher was capped like one started from Moonlight. "Harmless for the
# entries that are not games" was the reasoning, and it was wrong. mangohud
# preloads its OpenGL shim into whatever it starts, and Firefox dies of that
# immediately, every time: measured in a seat, SIGSEGV during EGL setup, a
# minidump written and nothing on screen. Which made the browser unusable from
# the one menu a person driving a gamepad can reach, and gave no hint at all
# that the launcher was the reason.
#
# The cap did not go anywhere. It is in Sunshine's env block for what a client
# picks, and in each game's own entry for what somebody picks here, written by
# the daemon: 21039 fps uncapped becomes 59.94 through that form, measured with
# glxgears in a seat. What is no longer capped is a game somebody starts from an
# entry Polyseat did not write, and that is the smaller loss.

[colors]
background=1b2430f0
text=d8dee9ff
match=7fb2d8ff
selection=285577ff
selection-text=ffffffff
selection-match=9fd0f0ff
border=4c7899ff

[border]
width=2
radius=8
