# Polyseat - Sunshine inside the seat
#
# Generated by polyseatd. Edits are overwritten whenever the seat starts,
# because csrf_allowed_origins below is derived from the seat's current
# addresses.
#
# Deliberately NO audio_sink: when streaming, Sunshine creates its own sink
# (sink-sunshine-stereo) and makes it the default. Pointing this option at a
# different sink makes Sunshine capture the wrong one - the game plays into
# Sunshine's sink and what gets transmitted is silence. There is no real sound
# card inside the container, so there is also no default sink to protect.
#
# wlr capture is the only viable path on NVIDIA; KMS capture does not work with
# the proprietary driver. It is also the only one available in a container at
# all: KMS capture wants cap_sys_admin on the Sunshine binary, which is not
# something a seat is going to be given.
capture = wlr
# Named rather than left to Sunshine's own probing. Probing usually lands on
# the right encoder, and "usually" is how a seat ends up on libx264 with
# nobody noticing until a game stutters. nvenc for NVIDIA, vaapi for AMD, which
# on Linux is the only hardware encoder AMD has: AMF is a Windows library.
encoder = {{.Encoder}}
{{- if .Adapter}}
# Which card to encode on. Only set where it can be wrong: Sunshine takes the
# first card it finds otherwise, and a machine with two would be a coin toss.
adapter_name = {{.Adapter}}
{{- end}}
{{- if eq .Encoder "nvenc"}}

# Use every encoder the card has, at every resolution.
#
# Cards from the RTX 4080 upwards carry two NVENC units, and Sunshine can split
# one frame across both. Its own words for what that buys: "significantly
# reduces host processing latency with a marginal compression efficiency
# penalty".
#
# Left to the driver it only happens at 4K or above. That is the wrong rule for
# a seat: a client at 1080p or 1440p gets the same benefit and leaves the second
# unit idle for no reason. A card with one unit ignores this, so it costs
# nothing to set it everywhere.
nvenc_split_encode = enabled
{{- end}}
origin_web_ui_allowed = lan

# By default Sunshine's CSRF protection only allows localhost origins, so
# opening the web interface over the network fails on save with "CSRF
# Protection Error". These are the seat's own addresses.
csrf_allowed_origins = {{.Origins}}

# Give the connecting client the resolution it actually asked for.
#
# The seat's output is virtual, so unlike a real monitor it can simply become
# whatever size is wanted. Sunshine puts the client's size in the environment
# of these commands and the headless output takes a new mode at runtime, so
# this is the whole of it: "do" adopts the client's size, "undo" puts the
# seat's configured mode back for the next one. See polyseat-resize, which is
# careful never to fail, because a prep command that returns non-zero stops the
# stream from starting at all.
# And cap the framerate to the one it asked for.
#
# Separate from the resize because it is a separate thing: the output's refresh
# rate paces whatever waits for vblank, and this reaches the games that do not.
# See polyseat-fps.
# And write down who is streaming and what they asked for, because Sunshine has
# no endpoint that answers it and these commands are the one place where it is
# known. See polyseat-session.
global_prep_cmd = [{"do":"/usr/local/bin/polyseat-resize","undo":"/usr/local/bin/polyseat-resize {{.Resolution}}"},{"do":"/usr/local/bin/polyseat-fps","undo":"/usr/local/bin/polyseat-fps off"},{"do":"/usr/local/bin/polyseat-session","undo":"/usr/local/bin/polyseat-session off"}]
