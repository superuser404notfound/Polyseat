# Polyseat - Sunshine inside the seat
#
# Deliberately NO audio_sink: when streaming, Sunshine creates its own sink
# (sink-sunshine-stereo) and makes it the default. Pointing this option at a
# different sink makes Sunshine capture the wrong one - the game plays into
# Sunshine's sink and what gets transmitted is silence. There is no real sound
# card inside the container, so there is also no default sink to protect.
#
# wlr capture is the only viable path on NVIDIA; KMS capture does not work with
# the proprietary driver.
capture = wlr
encoder = nvenc
origin_web_ui_allowed = lan
