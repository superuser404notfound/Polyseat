# polyseat — Sunshine im Seat
#
# Bewusst KEIN audio_sink: Sunshine legt beim Streamen seinen eigenen Sink
# (sink-sunshine-stereo) an und setzt ihn als Standard. Wer hier einen
# anderen Sink einträgt, lässt Sunshine den falschen abgreifen — das Spiel
# spielt in Sunshines Sink, übertragen wird Stille. Im Container gibt es
# keine echte Soundkarte, also auch keinen Grund, den Standard zu schützen.
# wlr-Capture ist auf NVIDIA der einzige gangbare Weg; KMS-Capture
# funktioniert mit dem proprietären Treiber nicht.
capture = wlr
encoder = nvenc
origin_web_ui_allowed = lan
