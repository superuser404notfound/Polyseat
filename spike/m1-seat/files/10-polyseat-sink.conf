# polyseat — Null-Sink für den Stream.
#
# Deklarativ statt "exec pactl load-module" in der sway-Config: PipeWire
# überlebt einen sway-Neustart, ein exec würde den Sink also bei jedem
# Neustart erneut anlegen (beobachtet: vier identische Sinks).
#
# Im Container gibt es keine echte Soundkarte — dieser Sink ist damit der
# einzige und automatisch der Standard. Der klassische Konflikt
# "Desktop-Ton landet im Stream" kann hier nicht entstehen.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "polyseat"
            node.description = "polyseat stream"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
        }
    }
]
