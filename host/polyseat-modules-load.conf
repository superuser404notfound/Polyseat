# uhid, loaded at boot.
#
# The daemon's observer attaches a kprobe to uhid_dev_create2 to record which
# container created each gamepad. A kprobe attaches to a symbol the running
# kernel has, and where uhid is a module its symbols do not exist until it is
# loaded. Nothing loads it early enough on its own: /dev/uhid is a static node
# from modules.devname and the module is autoloaded only when something first
# opens it, which is the first seat that runs a pad. Without this the daemon
# starts seconds into boot and finds no symbol.
uhid
